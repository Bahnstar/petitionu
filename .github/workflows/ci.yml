name: CI
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The server tests create their own databases here; the schema-dump tests run pg_dump
      # through `docker run postgres:17`.
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - name: Install PostgreSQL 17 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - run: python3 scripts/release-smoke.py
      - run: scripts/backup-smoke.sh
      - name: Back up, restore and rehearse the cutover on seeded data
        run: |
          createdb petitionu_ci_seed
          export DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/petitionu_ci_seed
          node apps/server/dist/migrate.js
          bun run seed
          python3 scripts/backup-restore-check.py petitionu_ci_seed
          DATABASE_URL=postgresql:///petitionu_ci_seed scripts/backup.sh "$RUNNER_TEMP/seed.dump"
          CUTOVER_PASSWORD=petitionu-dev-password \
            python3 scripts/cutover-rehearsal.py "$RUNNER_TEMP/seed.dump" --email student@example.edu
